<!doctype html><meta charset="utf-8"><title>Right-facing modular ship REVIEW</title><style>body{background:#15212d;color:#eee;font:16px/1.7 sans-serif;margin:24px}img{max-width:100%;background:#334754}</style><h1>右向船体、贯通房门与中央梯井 · REVIEW</h1><p>正式方向：船头朝右，航行和炮口默认朝右。动力舱具有左右贯通门和前景船员工作带；中央梯井固定连接船舱与甲板，且不占建造格。房间仍高于格子框架。</p><img src="ship_layout_right_v009_1280x720.png"><h2>Lv1 → Lv2 两侧扩展</h2><img src="ship_modular_upgrade_v001.png"><p>Lv1=左2+右1；Lv2=左3+右3。升级从交通核两侧向外增加，既有房间、梯井和稳定槽位ID不移动。</p>
