<!doctype html><meta charset="utf-8"><title>Right-facing modular ship REVIEW</title><style>body{background:#15212d;color:#eee;font:16px/1.7 sans-serif;margin:24px}img{max-width:100%;background:#334754}</style><h1>右向船体、房间层级与模块升级 · REVIEW</h1><p>正式方向：船头朝右，航行和炮口默认朝右。房间层高于格子框架；动力舱覆盖两格之间的中柱。桅杆/帆/缆绳/灯为独立动画候选，桶和箱子为静态装饰。</p><img src="ship_layout_right_v009_1280x720.png"><h2>Lv1 → Lv2 模块扩展</h2><img src="ship_modular_upgrade_v001.png"><p>Lv1=一段三格中段；Lv2=追加第二段。旧槽位ID和房间不移动。</p>
