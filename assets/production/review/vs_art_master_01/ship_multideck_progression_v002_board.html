<!doctype html><meta charset="utf-8"><title>Lv1-Lv7 multideck ship REVIEW</title><style>body{background:#15212d;color:#eee;font:16px/1.7 sans-serif;margin:24px}img{max-width:100%;display:block;margin:18px 0;background:#233542}</style><h1>Lv1–Lv7 多层船体与镜头方案 · REVIEW</h1><p>普通房间统一占1个舱位，火炮只占甲板炮位；中央梯井与固定甲板建筑不占普通舱位。纵向扩层优先，避免后期船体无限横向拉长。</p><img src="ship_hull_progression_lv1_lv7_v002.png"><h2>大型船体镜头策略</h2><img src="ship_camera_scaling_v002.png"><p>Lv4–Lv7 是扩展规范，不扩大当前垂直切片实现范围。</p>
